# dsh-annotate — 侧边栏批注
#
# 装上即生效：聊天输入框右侧多一个「批注」按钮，点开是右侧停靠的批注面板；
# 在对话文字 / 对话图片 / 右侧面板内容上「选中 → ＋批注 / 点图 → ＋批注」即可。
#
# 必须用 `- insert:` 包裹顶层 `- id:`：bundle patch 里扁平 `- id:` 只会被 loader
# 当成「改已有条目配置」，条目不存在时是空操作，插件永远挂不上。
#
# 无可配置项（config 留空即可）。数据只在浏览器内存里，刷新即清空。
- insert:
    - id: annotate
      name: dsh-annotate
      config: {}
